name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Validate runtime inventory and manifest
        run: python3 tools/package.py --check
      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n 1 luac5.4 -p
      - name: Test independent Lua behavior
        run: lua5.4 tests/unit.lua
      - name: Test package integrity and reproducibility
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build package and verify checksums
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("cartridge.json"))["version"])')"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          python3 tools/package.py --tag "$tag"
          (cd dist && sha256sum --check SHA256SUMS)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the tagged runtime payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/package.py --tag "$RELEASE_TAG"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/release.json \
            --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.md
